<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Error | SaludData STEM</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body>

    <main class="min-h-screen flex items-center justify-center p-6">

        <section class="max-w-xl w-full rounded-2xl p-8 shadow-lg bg-white">

            <h1 class="text-2xl font-bold mb-4">
                No fue posible cargar el dashboard
            </h1>

            <p class="mb-6">
                Se produjo un error al procesar la fuente de datos.
            </p>

            {% if error %}
                <div class="p-4 rounded-lg bg-red-50 text-red-700 mb-6">
                    {{ error }}
                </div>
            {% endif %}

            <a
                href="{{ url_for('main.index') }}"
                class="inline-block px-5 py-3 rounded-lg bg-slate-900 text-white"
            >
                Volver al inicio
            </a>

        </section>

    </main>

</body>
</html>
